<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Hitung Nilai Akhir</title>
</head>
<body>
  <h2>Hitung Nilai Akhir</h2>

  <label for="tugas">Nilai Tugas:</label>
  <input type="number" id="tugas" placeholder="contoh: 80"><br>

  <label for="uts">Nilai UTS:</label>
  <input type="number" id="uts" placeholder="contoh: 75"><br>

  <label for="uas">Nilai UAS:</label>
  <input type="number" id="uas" placeholder="contoh: 90"><br>

  <button onclick="hitungNilai()">Hitung</button>

  <p id="hasil"></p>

  <script>
    function hitungNilai() {
      const tugas = Number(document.getElementById("tugas").value);
      const uts = Number(document.getElementById("uts").value);
      const uas = Number(document.getElementById("uas").value);

      const nilaiAkhir = (tugas * 30 + uts * 30 + uas * 40) / 100;

      let grade;
      if (nilaiAkhir >= 90) {
        grade = "A";
      } else if (nilaiAkhir >= 80) {
        grade = "B";
      } else if (nilaiAkhir >= 70) {
        grade = "C";
      } else {
        grade = "D";
      }

      let status;
      if (nilaiAkhir >= 75 && uas >= 60) {
        status = "Lulus";
      } else {
        status = "Remedial";
      }

      document.getElementById("hasil").innerHTML =
        "Nilai Akhir: " + nilaiAkhir + "<br>" +
        "Grade: " + grade + "<br>" +
        "Status: " + status;
    }
  </script>
</body>
</html>
